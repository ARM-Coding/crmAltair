spring.application.name=crmAltair

# Configuración del servidor web embebido Tomcat 11
server.port=8080

# Conexión JDBC a PostgreSQL (Base de datos: altair, Esquema predeterminado: crm)
spring.datasource.url=jdbc:mariadb://localhost:3306/crm
spring.datasource.username=dev
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración de JPA / Hibernate (Jakarta Persistence)
spring.jpa.properties.hibernate.default_schema=crm
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

